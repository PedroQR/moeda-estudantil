spring:
  application:
    name: moeda-estudantil
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moeda_estudantil}
    username: ${SPRING_DATASOURCE_USERNAME:moeda}
    password: ${SPRING_DATASOURCE_PASSWORD:moeda123}
    driver-class-name: org.postgresql.Driver
  session:
    timeout: 12h
    jdbc:
      initialize-schema: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

app:
  mail:
    from: ${APP_MAIL_FROM:no-reply@moeda-estudantil.local}
    max-tentativas: ${APP_MAIL_MAX_TENTATIVAS:5}
    retry-delay-ms: 60000
